<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Relicto" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Relicto</title>
  <style>
    .bg { fill: #f1f4f2; }
    .frame { stroke: #1f6f65; } .prim { fill: #1f6f65; } .gem { fill: #c99a2e; } .tint { fill: #7fb5ac; } .facet { stroke: #8a6613; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1719; }
      .frame { stroke: #4db6a5; } .prim { fill: #4db6a5; } .gem { fill: #dcae45; } .tint { fill: #2b7b70; } .facet { stroke: #7a5a10; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="20"/>
  <!-- Ikon: etalase berisi koleksi -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="frame" stroke-width="5" d="M20 88 V44 A30 30 0 0 1 80 44 V88"/>
    <path class="frame" stroke-width="5" d="M10 90 H90"/>
    <path class="frame" stroke-width="4" d="M20 62 H80"/>
  </g>
  <!-- rak atas: permata, bola, figur -->
  <polygon class="gem" points="33,40 41,49 33,60 25,49"/>
  <path class="facet" fill="none" stroke-width="1.4" d="M25 49 H41"/>
  <circle class="tint" cx="52" cy="52" r="8"/>
  <rect class="prim" x="64" y="44" width="10" height="16" rx="2"/>
  <circle class="prim" cx="69" cy="40" r="4"/>
  <!-- rak bawah: buku dan kotak koleksi -->
  <rect class="prim" x="26" y="71" width="7" height="16" rx="1"/>
  <rect class="gem" x="34.5" y="67" width="7" height="20" rx="1"/>
  <rect class="tint" x="43" y="73" width="7" height="14" rx="1"/>
  <rect class="prim" x="57" y="73" width="16" height="14" rx="2"/>
  <rect class="gem" x="61" y="78" width="8" height="4" rx="1"/>
</svg>
